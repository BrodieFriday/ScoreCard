<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whitetail Scorecard • Boone & Crockett Style</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Whitetail Antler Scorecard</h1>
            <p>Unofficial Boone & Crockett Typical Whitetail Calculator</p>
        </header>

        <div class="main-grid">
            <!-- Scoring Table -->
            <div class="scoring-panel">
                <table id="score-table">
                    <thead>
                        <tr>
                            <th>Measurement</th>
                            <th class="left-col">Left Antler</th>
                            <th class="right-col">Right Antler</th>
                            <th class="diff-col">Difference</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
                <button id="reset-btn" class="reset-btn">
                    <i class="fas fa-undo"></i> Reset All
                </button>
            </div>

            <!-- Sidebar Calculations -->
            <div class="calc-panel">
                <h2>Score Calculations</h2>
                
                <div class="input-group">
                    <label>Spread Credit</label>
                    <input type="number" id="spreadCredit" step="0.125" placeholder="0.000">
                </div>

                <div class="calc-row">
                    <div class="calc-group">
                        <label>Column 1 (Left)</label>
                        <input type="number" id="columnOne" readonly>
                    </div>
                    <button onclick="calculateColumn1()" class="calc-btn">Calculate Left</button>
                </div>

                <div class="calc-row">
                    <div class="calc-group">
                        <label>Column 2 (Right)</label>
                        <input type="number" id="columnTwo" readonly>
                    </div>
                    <button onclick="calculateColumn2()" class="calc-btn">Calculate Right</button>
                </div>

                <div class="calc-row">
                    <div class="calc-group">
                        <label>Subtotal</label>
                        <input type="number" id="subtotal" readonly>
                    </div>
                    <button onclick="calculateSubtotal()" class="calc-btn">Calc Subtotal</button>
                </div>

                <div class="calc-row">
                    <div class="calc-group">
                        <label>Column 3 (Diff)</label>
                        <input type="number" id="columnThree" readonly>
                    </div>
                    <button onclick="calculateColumn3()" class="calc-btn">Calculate Diff</button>
                </div>

                <div class="final-score">
                    <label>FINAL SCORE</label>
                    <input type="number" id="finalScore" readonly class="final-input">
                    <button onclick="calculateFinal()" class="final-btn">Calculate Final Score</button>
                </div>
            </div>
        </div>

        <div class="conversion-key">
            <h3>Eighths Conversion</h3>
            <div class="key-grid">
                <div>1/8 = 0.125</div>
                <div>2/8 = 0.250</div>
                <div>3/8 = 0.375</div>
                <div>4/8 = 0.500</div>
                <div>5/8 = 0.625</div>
                <div>6/8 = 0.750</div>
                <div>7/8 = 0.875</div>
            </div>
        </div>
    </div>

    <script src="js/scorecard.js"></script>
</body>
</html>
