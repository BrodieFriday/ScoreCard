<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whitetail Antler Scorecard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Whitetail Antler Scorecard</h1>
            <p class="subtitle">Boone & Crockett Style Typical Calculator</p>
        </header>

        <div class="main-grid">
            <!-- Scoring Table -->
            <div class="scoring-panel">
                <div class="panel-header">
                    <h2>Measurements</h2>
                </div>
                <table id="score-table">
                    <thead>
                        <tr>
                            <th>Measurement</th>
                            <th class="left-col">Left Antler</th>
                            <th class="right-col">Right Antler</th>
                            <th class="diff-col">Difference</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
                <button id="reset-btn" class="reset-btn">Reset All Fields</button>
            </div>

            <!-- Sidebar -->
            <div class="calc-panel">
                <div class="panel-header">
                    <h2>Calculations</h2>
                </div>
                
                <div class="input-group">
                    <label for="spreadCredit">Spread Credit (Inside Spread)</label>
                    <input type="number" id="spreadCredit" step="0.125" placeholder="0.000">
                </div>

                <div class="calc-row">
                    <div class="calc-group">
                        <label>Column 1 — Left Antler</label>
                        <input type="number" id="columnOne" readonly class="result-input">
                    </div>
                    <button onclick="calculateColumn1()" class="calc-btn primary">Calc Left</button>
                </div>

                <div class="calc-row">
                    <div class="calc-group">
                        <label>Column 2 — Right Antler</label>
                        <input type="number" id="columnTwo" readonly class="result-input">
                    </div>
                    <button onclick="calculateColumn2()" class="calc-btn primary">Calc Right</button>
                </div>

                <div class="calc-row">
                    <div class="calc-group">
                        <label>Subtotal (Before Diff)</label>
                        <input type="number" id="subtotal" readonly class="result-input">
                    </div>
                    <button onclick="calculateSubtotal()" class="calc-btn accent">Calc Subtotal</button>
                </div>

                <div class="calc-row">
                    <div class="calc-group">
                        <label>Column 3 — Total Difference</label>
                        <input type="number" id="columnThree" readonly class="result-input">
                    </div>
                    <button onclick="calculateColumn3()" class="calc-btn primary">Calc Diff</button>
                </div>

                <div class="final-score-box">
                    <label class="final-label">FINAL NET SCORE</label>
                    <input type="number" id="finalScore" readonly class="final-input">
                    <button onclick="calculateFinal()" class="final-btn">Calculate Final Score</button>
                </div>
            </div>
        </div>

        <div class="conversion-key">
            <h3>Eighths to Decimal Conversion</h3>
            <div class="key-grid">
                <div>1/8 = <strong>0.125</strong></div>
                <div>2/8 = <strong>0.250</strong></div>
                <div>3/8 = <strong>0.375</strong></div>
                <div>4/8 = <strong>0.500</strong></div>
                <div>5/8 = <strong>0.625</strong></div>
                <div>6/8 = <strong>0.750</strong></div>
                <div>7/8 = <strong>0.875</strong></div>
            </div>
        </div>
    </div>

    <script src="js/scorecard.js"></script>
</body>
</html>
